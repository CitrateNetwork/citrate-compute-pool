name: Release (compute-pool)

# Cross-platform release for compute-pool binaries (pool-coordinator
# + training-worker). Same pattern as citrate-chain release.yml.
# See release ceremony prep audit (2026-05-21) for context.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish or rebuild (e.g. v0.5.0-beta1)'
        required: true
        type: string
      publish_release:
        description: 'Publish immediately instead of creating a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config

      - name: Install cross (aarch64-linux)
        if: matrix.cross
        run: cargo install cross --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build compute-pool binaries
        shell: bash
        run: |
          set -e
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.target }} \
              -p citrate-pool-coordinator -p citrate-training-worker
          else
            cargo build --release --locked --target ${{ matrix.target }} \
              -p citrate-pool-coordinator -p citrate-training-worker
          fi
          ls -la "target/${{ matrix.target }}/release" | head -20

      - name: Package release archive
        shell: bash
        run: |
          set -e
          STAGE="citrate-compute-pool-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          TARGET_DIR="target/${{ matrix.target }}/release"
          for bin in citrate-pool-coordinator citrate-training-worker; do
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "$TARGET_DIR/$bin.exe" "dist/$STAGE/" 2>/dev/null || true
            else
              cp "$TARGET_DIR/$bin" "dist/$STAGE/" 2>/dev/null || true
            fi
          done
          cp LICENSE README.md "dist/$STAGE/" 2>/dev/null || true
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "${STAGE}.zip" "$STAGE/"
          else
            tar -czf "${STAGE}.tar.gz" "$STAGE/"
          fi

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          for f in citrate-compute-pool-${{ matrix.target }}.*; do
            if [[ -f "$f" ]]; then
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                shasum -a 256 "$f" > "$f.sha256"
              else
                sha256sum "$f" > "$f.sha256"
              fi
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: citrate-compute-pool-${{ matrix.target }}
          path: dist/citrate-compute-pool-${{ matrix.target }}.*
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename citrate-compute-pool-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: citrate-compute-pool-sbom
          path: 'citrate-compute-pool-sbom*.json'
          retention-days: 90

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [build, sbom]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) -exec cp {} release-files/ \;
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: citrate-compute-pool ${{ steps.tag.outputs.tag }}
          draft: ${{ !github.event.inputs.publish_release }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-files/*
          body: |
            ## citrate-compute-pool ${{ steps.tag.outputs.tag }}

            Pool-coordinator + training-worker binaries for federated
            learning compute orchestration.

            See `citrate-compliance/runbooks/releases/compute-pool.md`
            for install + run instructions.

            **Status**: unsigned-pre-release.
