name: cargo audit (tripwire)

# REM-13a / REM-15a tripwire (2026-05-20 federation-split audit):
# Catches regression of the closed F-05 (rustls-webpki) advisory
# cluster and surfaces new advisories early. Runs per-PR + weekly
# per the cadence in:
#   citrate-agentile-archive/sops/vulnerability-scanning.md
#
# Failure policy:
#   * `cargo audit` fail on any UNALLOWED advisory.
#   * Known-deferred advisories are listed in `audit.toml` with a
#     reason + the linked REM tracker, so adding a new finding to
#     `audit.toml` requires a deliberate PR (which the reviewer must
#     reject if the new finding isn't matched by an open REM).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # `cargo audit` reads ~/.cargo/audit.toml not project-local,
        # so the ignores below are inline. Each ignore MUST cite the
        # owning REM tracker. Documentation copy of these ignores
        # lives in the project-root `audit.toml` for assessor
        # convenience; it is not consumed by the tool.
        #
        # REM-15a (open — upstream-blocked):
        #   - RUSTSEC-2026-0119 hickory-proto O(n²) DoS — needs
        #     libp2p-mdns upstream bump to hickory >=0.26.1
        #   - RUSTSEC-2026-0118 hickory-proto NSEC3 — no fix available
        # NOTE: compute-pool does not use mdns (libp2p features
        # exclude it); the hickory path is in-lockfile but not
        # in-binary. See audit.toml for full reasoning.
        #
        # CCP-06 (federation graded audit 2026-09-02):
        #   - RUSTSEC-2026-0185 quinn-proto memory exhaustion —
        #     lockfile-only, NOT in-binary (compute-pool's libp2p
        #     feature list excludes `quic`; `cargo tree -i quinn-proto
        #     -e normal` prints nothing). Ignored with the same
        #     in-lockfile-not-in-binary rationale as hickory; prefer a
        #     bump the moment a quic transport is enabled.
        #   The two other CCP-06 advisories were CLOSED by dep bumps,
        #   so they carry no --ignore:
        #   - RUSTSEC-2026-0204 crossbeam-epoch (was in-binary) → 0.9.20
        #   - RUSTSEC-2026-0258 h2 → 0.4.19
        #
        # When any ignored advisory closes upstream, REMOVE its
        # --ignore flag here + the entry in audit.toml. Failure is the
        # tripwire.
        run: |
          cargo audit \
            --color always \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0185
