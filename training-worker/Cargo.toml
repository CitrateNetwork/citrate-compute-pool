[package]
name = "citrate-training-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DataParallel training-worker binary for CM-07. Joins training pools, runs forward+backward passes via a pluggable ModelBackend, participates in ring all-reduce, posts per-step commitments and receives per-epoch payouts via ComputePoolTraining."

# See:
# - .agentile/planset/compute-marketplace-buildout/CM-07-dataparallel-scoped.md
# - .agentile/formal/specs/compute/DataParallelTrainingJob.tla
# - citrate_v0.01.1/docs/adr/ADR-008-gradient-commitment.md
# - citrate_v0.01.1/contracts/src/ComputePoolTraining.sol

[lib]
name = "citrate_training_worker"
path = "src/lib.rs"

[[bin]]
name = "citrate-training-worker"
path = "src/bin/main.rs"

# The member-facing daemon: register a machine with the training coordinator and
# poll for work. Separate from the binary above, which is the chain-event daemon.
[[bin]]
name = "citrate-coop-worker"
path = "src/bin/coop_worker.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
hex = "0.4"

# The SHARED Q16.16 boundary kernel — the same crate `nat-types` re-exports, so
# NAT, the chain and this worker are on one grid BY CONSTRUCTION rather than by
# three matching reimplementations. Pinned by rev: the grid is a consensus
# surface for the challenge path, so it must not float.
citrate-fed-types = { git = "https://github.com/CitrateNetwork/citrate-fed-types.git", rev = "7000687c75c83cf40376c84f0062b99634457f57" }

# NAT — the model the co-op trains. Pinned by rev: the parameter NAMES are the
# contract `zone_delta` attributes against, so an unpinned bump could silently
# reroute a zone's delta.
nat-candle = { git = "ssh://git@github.com/CitrateNetwork/nat.git", rev = "0f51255269e48028724f42a291b45d440feb477a", optional = true }
nat-types  = { git = "ssh://git@github.com/CitrateNetwork/nat.git", rev = "0f51255269e48028724f42a291b45d440feb477a", optional = true }
nat-data   = { git = "ssh://git@github.com/CitrateNetwork/nat.git", rev = "0f51255269e48028724f42a291b45d440feb477a", optional = true }
# The federated seam (signing, gather, settlement). Deliberately a SEPARATE
# feature from `nat`: it pulls no Candle, so a node can sign and settle
# contributions without building the trainer.
nat-federated = { git = "ssh://git@github.com/CitrateNetwork/nat.git", rev = "0f51255269e48028724f42a291b45d440feb477a", optional = true }
nat-train  = { git = "ssh://git@github.com/CitrateNetwork/nat.git", rev = "0f51255269e48028724f42a291b45d440feb477a", optional = true }
parking_lot = { workspace = true }
ethereum-types = "0.14"

# S1 HTTP chain clients: JSON-RPC + EIP-1559 signing. Mirrors the
# deps in pool-coordinator's http_chain path so the two wallet
# surfaces roundtrip on the same Web3 SSv3 keystore format
# (see FIXME at top of wallet.rs — unify post-pilot).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
# SECREM-02 6.3 (CITRATE_COMPUTE_POOL-2026-05-31-007): constant-time
# keystore MAC comparison (already in the tree via k256/aes).
subtle = "2.5"
# CP-B-005: wipe decrypted key material on drop (keystore decrypt path).
zeroize = "1.8"

# Daemon binary needs tracing-subscriber at runtime (was dev-only
# when the binary was a stub). Kept a single dep line — the dev
# section below no longer re-declares it.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# S1 libp2p transport (see src/libp2p_transport.rs + ADR-009).
# Feature set is deliberately minimal — we use tcp + noise + yamux
# for real peer-to-peer, memory for in-process tests, gossipsub
# for the message layer, and identify+ping for liveness.
# macros enables `#[derive(NetworkBehaviour)]`.
libp2p = { workspace = true, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "identify",
    "ping",
    "macros",
    "ed25519",
    "secp256k1",
] }
bincode = { workspace = true }
futures = "0.3"

# S2 candle backend (feature-gated). When the `candle-gpu` feature
# is OFF (default), these are not pulled in and the crate compiles
# CPU-only with no candle deps in the dependency tree. When ON,
# the crate gains a CPU-runnable Candle ModelBackend; turning on
# the candle-core/cuda sub-feature at install time enables H100.
# See `candle_backend.rs` module doc for the full feature matrix.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
safetensors = { version = "0.4", optional = true }

[features]
default = []
# Enables the structural Candle ModelBackend. CPU-runnable.
candle-gpu = ["dep:candle-core", "dep:candle-nn", "dep:safetensors"]
# Enables H100/CUDA acceleration on top of candle-gpu. Requires
# the CUDA runtime to be present at build + runtime.
candle-cuda = ["candle-gpu", "candle-core/cuda"]

# The REAL training backend: NAT's zone-partitioned and dense autoregressive LMs
# behind `ModelBackend`. Off by default so the standard build stays light — the
# artifact-verification and commitment layers this backend depends on are NOT
# gated, so the honesty checks compile and test everywhere.
nat = ["dep:nat-candle", "dep:nat-types", "dep:nat-data", "dep:candle-core", "federated"]
# The federated seam alone — signing + settlement, no Candle, no GPU stack.
federated = ["dep:nat-federated", "dep:nat-train", "dep:nat-types"]
# NAT on CUDA. Additive over `nat`.
nat-cuda = ["nat", "nat-candle/cuda"]
# Apple Silicon. Needs nat >= 52dd6b0b: earlier revisions have no `metal`
# feature at all, and the one before that resolved a fresh Metal device per call
# — which candle treats as a DIFFERENT device, so the first forward pass died on
# a mismatch whose two printed ids were identical. Measured on an M2 Max: f32 is
# run-to-run deterministic, bf16 is NOT, so Apple hardware should be pinned to
# f32 for any work that will be verified by recomputation.
nat-metal = ["nat", "nat-candle/metal"]

[dev-dependencies]
tokio = { workspace = true }
# Stub JSON-RPC server for http_chain_* tests, mirroring the
# pool-coordinator pattern (axum is dev-only for training-worker).
axum = "0.7"

# The real end-to-end run needs the trainer AND the federated seam, so it is
# gated: without this, `cargo test --workspace` on a default build tries to
# compile it and fails on the missing nat crates.
[[example]]
name = "real_training_run"
required-features = ["nat"]
